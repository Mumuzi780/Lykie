<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ text.title }} · 阅读 · Lykie</title>
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      } catch (e) { /* ignore */ }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=m76">
  <link rel="stylesheet" href="/static/reading.css?v=9">
</head>
<body class="reading-view-page" data-username="{{ username }}" data-text-id="{{ text.id }}" data-source="{{ text.source }}">
  <div class="reading-shell">
    <header class="reading-top">
      <div class="reading-top-brand">
        <span class="reading-brand">Lykie</span>
        <span class="reading-top-tagline">在哪里不会，点哪里。</span>
      </div>
      <div class="reading-top-actions">
        <a class="btn ghost" href="/reading">文章列表</a>
        <a class="btn ghost" href="/assets?back=/reading/{{ text.id }}">资产库</a>
        <a class="btn ghost" href="/">返回刷题</a>
        <span class="account-name" title="当前账号">{{ username }}</span>
        <a class="btn ghost" href="/logout">退出</a>
      </div>
    </header>

    <div class="reading-workspace" id="readingWorkspace">
      <header class="reading-article-head">
        <h1 class="reading-article-title">{{ text.title }}</h1>
        <p class="reading-article-source">来源 · {{ text.source }}</p>
      </header>

      <article id="readingArticle" class="reading-article" aria-label="正文">
        {% for p in paragraphs %}<p class="reading-p">{{ p }}</p>{% endfor %}
      </article>

      <p class="reading-hint reading-view-hint" id="readingHint"></p>
      <p class="reading-tip">划选词或短语 → 查词；划选长句 → 翻译。查词卡片可改可删，确认后存入资产库。</p>
    </div>

    {% if questions %}
    <button type="button" class="rd-qball" id="rdQBall" title="题目">
      <span class="rd-qball-num">{{ questions|length }}</span>
      <span class="rd-qball-label">题</span>
    </button>

    <div class="rd-qcard" id="rdQCard" hidden>
      <header class="rd-qcard-head">
        <span class="rd-qcard-pos" id="rdQPos"></span>
        <div class="rd-qcard-nav">
          <button type="button" class="btn ghost" id="rdQPrev">‹ 上一题</button>
          <button type="button" class="btn ghost" id="rdQNext">下一题 ›</button>
          <button type="button" class="btn ghost" id="rdQAllBtn">全部</button>
          <button type="button" class="btn ghost" id="rdQSingleBtn" hidden>单题</button>
          <button type="button" class="btn ghost" id="rdQClose" title="收起">✕</button>
        </div>
      </header>
      <div class="rd-qcard-body" id="rdQCardBody"></div>
    </div>

    <script>window.RD_QUESTIONS = {{ questions|tojson }};</script>
    {% endif %}
    <script>window.RD_MARKS = {{ lookup_marks|tojson }};</script>
  </div>

  <script src="/static/reading.js?v=9"></script>
</body>
</html>
