<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · Lykie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=m121">
</head>
<body class="login-body">
  <!-- 背景装饰：浮动光斑 -->
  <div class="login-orb login-orb-a" aria-hidden="true"></div>
  <div class="login-orb login-orb-b" aria-hidden="true"></div>
  <div class="login-orb login-orb-c" aria-hidden="true"></div>

  <main class="login-shell">
    <!-- 深浅色切换 -->
    <button type="button" class="login-celestial" id="loginCelestial" aria-label="切换深浅色" title="切换深浅色">
      <img class="celestial-icon celestial-sun" id="loginSun" src="/static/lykie/sun-solid-teal.png?v=6" alt="" draggable="false" hidden>
      <img class="celestial-icon celestial-moon" id="loginMoon" src="/static/lykie/moon-teal.png?v=1" alt="" draggable="false" hidden>
    </button>

    <section class="login-card">
      <!-- 左侧：角色 + 品牌 -->
      <div class="login-visual" aria-hidden="true">
        <div class="login-peek-wrap">
          <div class="login-peek login-blink" id="lykieBlink" draggable="false"></div>
        </div>
        <h1 class="brand-title login-brand">Lykie</h1>
        <p class="login-tagline">把学会的，变成自己的。</p>
        <div class="login-visual-line"></div>
        <p class="login-visual-quote">一个陪你学习、也陪你说话的小站。</p>
      </div>

      <!-- 右侧：表单 -->
      <form class="login-form" method="post" action="/login" autocomplete="on">
        <h2 class="login-form-title">欢迎回来</h2>
        <p class="login-form-sub">内测账号登录。没有账号的话，让开号的人给你建一个。</p>

        {% if error %}
        <p class="login-error">{{ error }}</p>
        {% endif %}
        {% if not has_users %}
        <p class="login-hint">还没有账号。在项目目录运行：<code>python add_user.py 用户名</code></p>
        {% endif %}

        <div class="login-field">
          <label class="login-label" for="username">用户名</label>
          <span class="login-input-wrap">
            <svg class="login-input-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input id="username" name="username" type="text" required maxlength="24" autofocus placeholder="输入用户名">
          </span>
        </div>

        <div class="login-field">
          <label class="login-label" for="password">密码</label>
          <span class="login-input-wrap">
            <svg class="login-input-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input id="password" name="password" type="password" required minlength="4" placeholder="输入密码">
          </span>
        </div>

        <button type="submit" class="login-send">
          <span class="send-glow" aria-hidden="true"></span>
          <span class="send-outline" aria-hidden="true"></span>
          <span class="send-state send-state--default">
            <span class="send-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14M13 5l7 7-7 7"/>
              </svg>
            </span>
            <span class="send-text"><span style="--i:0">进</span><span style="--i:1">入</span></span>
          </span>
          <span class="send-state send-state--sent" aria-hidden="true">
            <span class="send-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 6 9 17l-5-5"/>
              </svg>
            </span>
            <span class="send-text"><span style="--i:0">进</span><span style="--i:1">入</span></span>
          </span>
        </button>
      </form>
    </section>

    <div class="beian-bar">
      <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">冀ICP备2026049654号</a>
      <a href="https://beian.mps.gov.cn/#/query/webSearch?code=13030202004263" target="_blank" rel="noreferrer"><img src="/static/beian.png" alt="" class="beian-badge">冀公网安备13030202004263号</a>
    </div>
  </main>

  <script>
    (function () {
      try {
        var theme = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
        syncCelestial(theme);
      } catch (e) { /* ignore */ }

      function syncCelestial(theme) {
        var sun = document.getElementById('loginSun');
        var moon = document.getElementById('loginMoon');
        if (!sun || !moon) return;
        if (theme === 'dark') {
          sun.hidden = true;
          moon.hidden = false;
        } else {
          sun.hidden = false;
          moon.hidden = true;
        }
      }

      var btn = document.getElementById('loginCelestial');
      if (btn) {
        btn.addEventListener('click', function () {
          var cur = document.documentElement.getAttribute('data-theme') || 'light';
          var next = cur === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', next);
          document.documentElement.style.colorScheme = next;
          try { localStorage.setItem('theme', next); } catch (e) {}
          syncCelestial(next);
        });
      }
    })();
  </script>
  <script>
    /* Lykie 眨眼：雪碧图逐帧 + 随机间隔调度 */
    (function () {
      var el = document.getElementById('lykieBlink');
      if (!el) return;

      var FRAME_MS = [70, 45, 45, 50, 50, 50, 40, 40, 40, 50]; // 帧01..10 每帧停留时长
      var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var timer = null;
      var playing = false;

      function setFrame(i) {
        el.style.backgroundPosition = (i * 10) + '% 50%'; // 11 帧，每帧步进 10%
      }

      function play(i) {
        if (i >= FRAME_MS.length) {
          setFrame(0); // 回到睁眼静止帧
          playing = false;
          schedule();
          return;
        }
        setFrame(i + 1); // 播放 01..10
        timer = setTimeout(function () { play(i + 1); }, FRAME_MS[i]);
      }

      function schedule() {
        if (REDUCED) return;
        timer = setTimeout(blink, 2500 + Math.random() * 3500); // 2.5~6s 随机
      }

      function blink() {
        if (document.hidden) { schedule(); return; } // 页面不可见时不播
        if (playing) return;
        playing = true;
        play(0);
        if (Math.random() < 0.12) { // 12% 概率连眨两下
          timer = setTimeout(function () {
            if (!playing) blink();
          }, 560);
        }
      }

      schedule();
    })();
  </script>
  <script>
    /* 登录卡片 3D 倾斜：指针在卡片上的位置决定旋转角度。
       仅桌面（精确指针）启用；触屏不启用，避免悬停网格在移动端的卡顿，同时不影响表单交互。
       变换挂在 .login-shell 上，主题切换按钮与卡片整体一起倾斜；
       在 window 上跟踪指针并外扩一圈余量，避免指针靠近卡片边缘时因卡片转动反复进出而抽搐。 */
    (function () {
      var card = document.querySelector('.login-card');
      var shell = document.querySelector('.login-shell');
      if (!card || !shell) return;
      var fine = window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches;
      var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!fine || reduced) return;

      var MAX_RX = 8;       // 纵向最大倾斜（度）：顶部上仰、底部下俯
      var MAX_RY = 4;       // 横向最大倾斜（度）：左侧左转、右侧右转
      var PERSPECTIVE = 800;
      var MARGIN = 24;      // 卡片外扩的跟踪余量（px），防止边缘抽搐
      var rect = null;
      var raf = null;
      var active = false;
      var settled = false;

      function measure() {
        rect = card.getBoundingClientRect(); // 静止无变换时测量，倾斜期间固定复用
      }
      measure();
      setTimeout(measure, 800); // 入场动画结束后几何才稳定
      window.addEventListener('resize', measure);
      window.addEventListener('scroll', function () { if (!active) measure(); }, { passive: true });

      function apply(x, y) {
        var px = Math.min(Math.max((x - rect.left) / rect.width, 0), 1);
        var py = Math.min(Math.max((y - rect.top) / rect.height, 0), 1);
        var rx = (0.5 - py) * MAX_RX * 2;
        var ry = (px - 0.5) * MAX_RY * 2;
        shell.style.transform =
          'perspective(' + PERSPECTIVE + 'px) rotateX(' + rx.toFixed(2) + 'deg) rotateY(' + ry.toFixed(2) + 'deg)';
      }

      function reset() {
        active = false;
        shell.classList.remove('is-tilting');
        shell.style.transform = '';
      }

      /* 点击登录按钮后调用：卡片平滑回正（0.5s 过渡），并在提交动画期间停止倾斜跟踪 */
      function settle() {
        settled = true;
        reset();
      }
      window.__loginTiltSettle = settle;

      window.addEventListener('pointermove', function (e) {
        if (settled) return;
        var x = e.clientX, y = e.clientY;
        var inside = x >= rect.left - MARGIN && x <= rect.right + MARGIN &&
                     y >= rect.top - MARGIN && y <= rect.bottom + MARGIN;
        if (!inside) {
          if (active) reset();
          return;
        }
        if (!active) {
          active = true;
          measure(); // 刚进入时无变换，重新测量保证几何准确
          shell.classList.add('is-tilting');
        }
        if (raf) return;
        raf = requestAnimationFrame(function () {
          raf = null;
          if (active) apply(x, y);
        });
      });
      // 指针移出浏览器窗口时回正，避免卡在倾斜状态
      document.documentElement.addEventListener('pointerleave', function () { if (active) reset(); });
    })();
  </script>
  <script>
    /* 登录提交延迟：等按钮起飞/送达动画播完再提交表单。
       回车提交时按钮没有焦点，动画不会触发，所以先 focus 再延迟提交。 */
    (function () {
      var form = document.querySelector('.login-form');
      var btn = document.querySelector('.login-send');
      if (!form || !btn) return;
      var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var DELAY = 1200; // 提交延迟（ms），与加速后的按钮动画总时长匹配
      var pending = false;

      form.addEventListener('submit', function (e) {
        if (reduced || pending) return; // 减弱动态时立即提交；提交进行中不重复拦截
        e.preventDefault();
        pending = true;
        if (window.__loginTiltSettle) window.__loginTiltSettle(); // 卡片平滑回正
        if (window.__loginWarm) window.__loginWarm(); // 兜底：提交瞬间也触发资源预热
        btn.focus(); // 启动按钮动画（点击路径已有焦点，回车路径需要这一步）
        setTimeout(function () {
          form.submit();
        }, DELAY);
      });
    })();
  </script>
  <script>
    /* 主界面资源预热（保守）：用户聚焦/输入密码框才启动，作为登录意图信号。
       利用输入 + 按钮动画 + 提交往返的窗口把资源拉进缓存；
       prefetch 只下载不执行，不影响登录页。版本号需与 index.html 的引用保持一致，
       改动任一文件 bump 版本时记得同步此列表。 */
    (function () {
      var pwd = document.getElementById('password');
      if (!pwd) return;
      if (navigator.connection && navigator.connection.saveData) return; // 流量敏感模式不预热

      var PRELOAD = [
        '/static/sa.css?v=m5',
        '/static/reading.css?v=33',
        '/static/dialog.js?v=1',
        '/static/sa.js?v=sa25',
        '/static/sfx.js?v=11',
        '/static/fx.js?v=10',
        '/static/script.js?v=m102',
        '/static/mock.js?v=8',
        '/static/story.js?v=m6',
        '/static/reading.js?v=45'
      ];
      var fired = false;

      function warm() {
        if (fired) return;
        fired = true;
        PRELOAD.forEach(function (url) {
          var link = document.createElement('link');
          link.rel = 'prefetch';
          link.href = url;
          link.as = url.indexOf('.css') > -1 ? 'style' : 'script';
          document.head.appendChild(link);
        });
      }
      window.__loginWarm = warm; // 提交时兜底触发

      pwd.addEventListener('focus', warm, { once: true });
      pwd.addEventListener('input', warm, { once: true });
    })();
  </script>
</body>
</html>
