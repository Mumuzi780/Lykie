<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阅读 · Lykie</title>
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      } catch (e) { /* ignore */ }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=m76">
  <link rel="stylesheet" href="/static/reading.css?v=2">
</head>
<body class="reading-page" data-username="{{ username }}">
  <div class="reading-shell">
    <header class="reading-top">
      <div class="reading-top-brand">
        <span class="reading-brand">Lykie</span>
        <span class="reading-top-tagline">在哪里不会，点哪里。</span>
      </div>
      <div class="reading-top-actions">
        <button type="button" class="btn" id="newTextBtn">新建文章</button>
        <a class="btn ghost" href="/assets">资产库</a>
        <a class="btn ghost" href="/">返回刷题</a>
        <span class="account-name" title="当前账号">{{ username }}</span>
        <a class="btn ghost" href="/logout">退出</a>
      </div>
    </header>

    <section class="reading-new" id="newTextPanel" hidden>
      <form id="newTextForm" class="reading-new-form" autocomplete="off">
        <div class="reading-new-row">
          <label class="reading-label" for="newTitle">标题</label>
          <input id="newTitle" type="text" maxlength="120" required placeholder="如：2024-12 第一套 阅读1">
        </div>
        <div class="reading-new-row">
          <label class="reading-label" for="newSource">来源 <span class="opt">必填，本篇查词卡片自动带上</span></label>
          <input id="newSource" type="text" maxlength="200" required placeholder="如：四级真题202412第一套阅读1">
        </div>
        <div class="reading-new-row">
          <label class="reading-label" for="newContent">正文 <span class="opt">直接粘贴 PDF 复制的文本，自动分段</span></label>
          <textarea id="newContent" rows="10" required placeholder="粘贴文章原文…"></textarea>
        </div>
        <div class="reading-new-row">
          <label class="reading-label">分段预览 <span class="opt">所见即最终阅读效果；漏分段的地方，在正文里补一个空行即可</span></label>
          <div class="reading-preview" id="newTextPreview" hidden>
            <p class="reading-preview-count" id="newTextPreviewCount"></p>
            <div class="reading-article reading-preview-body" id="newTextPreviewBody"></div>
          </div>
        </div>
        <div class="reading-new-actions">
          <span class="reading-hint" id="newTextHint"></span>
          <button type="button" class="btn ghost" id="newTextCancel">收起</button>
          <button type="submit" class="btn" id="newTextSubmit">保存并开始阅读</button>
        </div>
      </form>
    </section>

    <section class="reading-list-wrap" aria-label="文章列表">
      <h2 class="reading-section-title">我的文章</h2>
      <div id="readingTextList" class="reading-text-list">加载中…</div>
    </section>
  </div>

  <script src="/static/reading.js?v=2"></script>
</body>
</html>
