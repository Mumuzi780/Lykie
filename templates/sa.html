<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>简答训练 · Lykie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=m23">
  <link rel="stylesheet" href="/static/sa.css?v=m2">
</head>
<body class="sa-app">
  <div class="app sa-app">
    <div class="main sa-main">
      <header>
        <h1 class="brand-title">Lykie <span class="brand-sub">简答</span></h1>
        <div class="stats" id="saStats">加载中…</div>
        <div class="actions">
          <a class="btn ghost" href="/">返回背题</a>
          <button id="saEditKwBtn" class="btn ghost" type="button" disabled>编辑关键词</button>
          <button id="saResetBtn" class="btn ghost danger">重置简答进度</button>
          <span class="account-name">{{ username }}</span>
          <a class="btn ghost" href="/logout">退出</a>
        </div>
      </header>

      <main class="card-area">
        <div class="empty" id="saEmpty" hidden>
          <p id="saEmptyTitle">暂无题目</p>
          <p class="hint" id="saEmptyHint"></p>
        </div>

        <div class="card" id="saCard" hidden>
          <div class="card-top">
            <span class="card-type" id="saType">简答题</span>
            <span class="sa-stage" id="saStage"></span>
          </div>
          <div class="card-stem" id="saStem"></div>
          <div class="card-meta" id="saPrompt"></div>
          <div id="saBody"></div>
          <div class="sa-feedback" id="saFeedback" hidden></div>
        </div>
      </main>

      <footer>
        <div class="controls">
          <div class="main-btns" id="saControls"></div>
        </div>
      </footer>
    </div>
  </div>

  <div class="modal" id="saKwModal" hidden>
    <div class="modal-box sa-kw-modal">
      <h3>编辑关键词</h3>
      <p class="hint" id="saKwStem"></p>
      <div class="sa-kw-list" id="saKwList"></div>
      <label class="sa-kw-unordered">
        <input type="checkbox" id="saKwUnordered">
        并列要点挖空可打乱顺序（仅清单类题勾选；句内前缀已锁定答案时不要勾）
      </label>
      <div class="modal-actions">
        <button id="saKwCancelBtn" class="btn ghost" type="button">取消</button>
        <button id="saKwSaveBtn" class="btn primary" type="button">保存</button>
      </div>
    </div>
  </div>
  <script src="/static/sa.js?v=sa17"></script>
</body>
</html>
